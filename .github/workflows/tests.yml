name: tests
on:
  pull_request:
    paths: ['post/**', 'tests/**', '.github/workflows/tests.yml']
  push:
    branches: [main]
    paths: ['post/**', 'tests/**', '.github/workflows/tests.yml']
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_db_scripts.py -v
